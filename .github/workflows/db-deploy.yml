name: Database deploy

# Applies new migrations to the Supabase project when they reach main.
# Turn it on by setting the repository variable DB_DEPLOY_ENABLED to "true"
# and adding the three secrets below.
on:
  push:
    branches: [main]
    paths: ["packages/db/supabase/migrations/**"]
  workflow_dispatch:

jobs:
  push:
    if: ${{ vars.DB_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations
        working-directory: packages/db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push
