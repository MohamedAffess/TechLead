name: Go live

# Creates or updates the hosted TechLead: the Supabase project and schema,
# and the web app and API on Vercel. It runs only when you start it from
# Actions > Go live > Run workflow, so nothing reaches production without you.
# Needs the repository secrets SUPABASE_ACCESS_TOKEN and VERCEL_TOKEN
# (and ANTHROPIC_API_KEY for the AI). See docs/DEPLOYMENT.md, "Fast path".
on:
  workflow_dispatch:

concurrency:
  group: go-live
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@59.26.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and VERCEL_TOKEN as repository secrets first (docs/DEPLOYMENT.md, Fast path)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Supabase and Vercel projects
        id: prepare
        run: node scripts/go-live.mjs prepare
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          SUPABASE_REGION: ${{ vars.SUPABASE_REGION }}
          JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
          JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}

      - name: Deploy the API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.prepare.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare.outputs.api_project_id }}
        run: bash scripts/vercel-deploy.sh

      - name: Deploy the web app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.prepare.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare.outputs.web_project_id }}
        run: bash scripts/vercel-deploy.sh

      - name: Check the live addresses
        id: finish
        run: node scripts/go-live.mjs finish
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OWNER_EMAIL: ${{ steps.prepare.outputs.owner_email }}
          EXPECTED_WEB_URL: ${{ steps.prepare.outputs.web_url }}
          EXPECTED_API_URL: ${{ steps.prepare.outputs.api_url }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}

      # Only when Vercel handed out different addresses than expected on the first run.
      - name: Redeploy the API with the final addresses
        if: steps.finish.outputs.redeploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.prepare.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare.outputs.api_project_id }}
        run: bash scripts/vercel-deploy.sh
      - name: Redeploy the web app with the final addresses
        if: steps.finish.outputs.redeploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.prepare.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.prepare.outputs.web_project_id }}
        run: bash scripts/vercel-deploy.sh
